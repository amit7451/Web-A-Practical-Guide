<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | HTML Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;0,9..144,680;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .not-found-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 40px 20px;
    }

    .not-found-code {
      font-family: var(--serif);
      font-size: 6rem;
      font-weight: 680;
      color: var(--red);
      line-height: 1;
      margin-bottom: 16px;
    }

    .not-found-title {
      font-size: 2rem;
      color: var(--paper);
      margin-bottom: 12px;
    }

    .not-found-desc {
      color: var(--ink-text-dim);
      max-width: 460px;
      margin-bottom: 32px;
    }

    .not-found-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--red);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 4px;
      transition: opacity 0.2s ease;
    }

    .home-btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--ink-2);
      border: 1px solid var(--ink-3);
      color: var(--paper);
    }
  </style>
</head>

<body>
  <div class="not-found-container">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Topic or Page Not Found</h1>
    <p class="not-found-desc">The manuscript page or topic you were looking for doesn't exist or has moved.</p>
    <div class="not-found-actions">
      <a href="index.html" class="home-btn">← All Guides Portal</a>
      <a href="html-guide/index.html" class="home-btn btn-secondary">HTML Guide</a>
      <a href="css-guide/index.html" class="home-btn btn-secondary">CSS Guide</a>
      <a href="js-guide/index.html" class="home-btn btn-secondary">JS Guide</a>
    </div>
  </div>
</body>

</html>
